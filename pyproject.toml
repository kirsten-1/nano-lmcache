[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-lmcache"
version = "0.1.0"
description = "A minimal, educational implementation of LMCache for KV cache management"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "kirsten-1"}
]
keywords = ["llm", "kv-cache", "inference", "transformer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/kirsten-1/nano-lmcache"
Repository = "https://github.com/kirsten-1/nano-lmcache"

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_lmcache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
